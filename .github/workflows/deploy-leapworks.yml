name: Deploy OpenSEO (LEAP WORKS)

on:
  workflow_dispatch:

concurrency:
  group: deploy-selfhost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.selfhost from secret
        run: |
          printf '%s\n' "$ENV_SELFHOST" > .env.selfhost
          if [ -n "$OPENROUTER_MODEL" ]; then
            printf 'OPENROUTER_MODEL=%s\n' "$OPENROUTER_MODEL" >> .env.selfhost
          fi
        env:
          ENV_SELFHOST: ${{ secrets.ENV_SELFHOST }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

      - name: Safety check - LEAPWORKS custom domain fix is present
        run: |
          grep -q 'SELFHOST_DOMAIN' alchemy.run.ts \
            || { echo "alchemy.run.ts is missing the SELFHOST_DOMAIN fix - stopping so seo.leapworks.io isn't removed."; exit 1; }
          grep -q '^SELFHOST_DOMAIN=' .env.selfhost \
            || { echo "SELFHOST_DOMAIN is missing from the ENV_SELFHOST secret - stopping."; exit 1; }

      - name: Safety check - token can see the account and state store
        run: |
          resp=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          sub=$(echo "$resp" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            echo "Token cannot read the account. Cloudflare said:"
            echo "$resp" | jq '.errors'
            exit 1
          fi
          echo "workers.dev subdomain: $sub"
          curl -sSf "https://alchemy-state-store.$sub.workers.dev/version" \
            || { echo "State store not reachable - stopping before deploy."; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: pnpm deploy:selfhost --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
